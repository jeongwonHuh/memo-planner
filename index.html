<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메모 플래너</title>
  <script>
    // 저장해 둔 테마(밝게/어둡게)를 화면이 그려지기 전에 먼저 적용 (깜빡임 방지)
    try { var t = localStorage.getItem('memoapp:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 왼쪽 메뉴 (휴대폰에서는 아래쪽 탭) -->
    <aside class="sidebar">
      <div class="brand">📒 메모 플래너</div>
      <nav class="nav">
        <a href="#/today" data-nav="today"><span class="ico">🏠</span><span class="lbl">오늘</span></a>
        <a href="#/memos" data-nav="memos"><span class="ico">📝</span><span class="lbl">메모</span></a>
        <a href="#/todos" data-nav="todos"><span class="ico">✅</span><span class="lbl">Todo</span></a>
        <a href="#/calendar" data-nav="calendar"><span class="ico">📅</span><span class="lbl">캘린더</span></a>
        <a href="#/search" data-nav="search" class="only-mobile"><span class="ico">🔍</span><span class="lbl">검색</span></a>
      </nav>
      <div class="side-search">
        <input id="searchInput" type="search" placeholder="🔍 메모·할 일·일정 검색" autocomplete="off">
      </div>
      <div class="side-tags">
        <div class="side-label">태그</div>
        <div id="tagList"></div>
      </div>
      <button class="side-settings" type="button" data-open-settings>⚙ 설정 · 백업</button>
    </aside>

    <!-- 오른쪽 내용 화면 -->
    <main id="view" class="view"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/memo.js"></script>
  <script src="js/todo.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/ai.js"></script>
  <script>App.init();</script>
</body>
</html>
